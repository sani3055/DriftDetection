temporal:
  train_fraction: 0.60
  validation_fraction: 0.20
  minimum_months_per_split: 1
  reference_split: train
  window_key: eventTime

features:
  chunk_size: 100000
  high_risk_events:
    - AttachUserPolicy
    - AttachRolePolicy
    - PutUserPolicy
    - PutRolePolicy
    - CreateAccessKey
    - DeleteTrail
    - StopLogging
    - UpdateTrail
    - AssumeRole
    - PutBucketPolicy
    - PutBucketAcl

