model:
  name: isolation_forest_event_baseline
  n_estimators: 100
  contamination: 0.05
  max_samples: auto
  random_state: 42
  n_jobs: -1
  chunk_size: 100000
  score_sample_per_window: 1000

features:
  categorical:
    - eventName
    - eventSource
    - awsRegion
    - userIdentitytype
    - errorCode
    - requestParametersinstanceType
  derived:
    - isRoot

